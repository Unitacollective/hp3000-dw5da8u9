<style>
:root{--bg:#EDF0EE;--surface:#FFFFFF;--ink:#14292D;--muted:#5A6B6D;--line:#D3DBD9;--primary:#17444C;--on-primary:#FFFFFF;--accent:#E0A21B;--bad:#C0392B}
@media (prefers-color-scheme: dark){:root{--bg:#0E181A;--surface:#152226;--ink:#E2EBE9;--muted:#93A6A6;--line:#2A3C40;--primary:#8CCFC9;--on-primary:#0E181A;--accent:#F0B53A;--bad:#EE7A6B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Segoe UI',system-ui,-apple-system,sans-serif;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 22px;display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
h1 .v{font-family:ui-monospace,Consolas,monospace;font-size:.82em;color:var(--accent)}
p{margin:0;color:var(--muted);font-size:15px}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid color-mix(in srgb,var(--muted) 60%,var(--surface));border-radius:8px;padding:12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.remember{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--muted)}
.remember input{width:18px;height:18px;accent-color:var(--primary)}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:13px;background:var(--primary);color:var(--on-primary);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;font-weight:700}
</style>
</head>
<body>
<form id="tor" autocomplete="on">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--primary)"/><rect x="7" y="8" width="9" height="5" rx="1.5" fill="var(--accent)"/><rect x="18" y="8" width="9" height="5" rx="1.5" fill="var(--on-primary)" opacity=".55"/><rect x="7" y="15" width="9" height="5" rx="1.5" fill="var(--on-primary)" opacity=".55"/><rect x="18" y="15" width="9" height="5" rx="1.5" fill="var(--accent)"/><rect x="7" y="22" width="20" height="5" rx="1.5" fill="var(--on-primary)" opacity=".3"/></svg>
    <h1>Hoschiplaner <span class="v">3000</span></h1>
  </div>
  <p>Diese App ist geschützt. Gib das Passwort ein, das du bekommen hast.</p>
  <input type="text" name="username" value="Hoschiplaner 3000" autocomplete="username" hidden>
  <label for="pw">Passwort<input type="password" id="pw" name="password" autocomplete="current-password" required autofocus></label>
  <label class="remember"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
  <div class="err" id="err" role="alert" hidden></div>
  <button type="submit" id="los">Öffnen</button>
</form>

const KEY='schichtwerk-schluessel';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
async function ableiten(pw){
  const basis=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATEN.salt),iterations:DATEN.iter,hash:'SHA-256'},basis,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function entschluesseln(key){
  const klar=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATEN.iv)},key,b64(DATEN.ct));
  return new TextDecoder().decode(klar);
}
function zeigen(html){document.open();document.write(html);document.close()}
async function gemerkt(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(_){}
  if(!raw)return;
  try{const key=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},false,['decrypt']);zeigen(await entschluesseln(key))}
  catch(_){try{localStorage.removeItem(KEY)}catch(_){}}  // Passwort wurde geändert
}
document.getElementById('tor').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('los'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
  if(!window.crypto||!crypto.subtle){err.hidden=false;err.textContent='Dieser Browser ist zu alt. Bitte Chrome oder Safari nutzen.';return}
  btn.disabled=true;btn.textContent='Wird geöffnet …';err.hidden=true;
  try{
    const key=await ableiten(pw);
    const html=await entschluesseln(key);
    if(document.getElementById('merken').checked){try{localStorage.setItem(KEY,toB64(await crypto.subtle.exportKey('raw',key)))}catch(_){}}
    zeigen(html);
  }catch(_){
    btn.disabled=false;btn.textContent='Öffnen';err.hidden=false;err.textContent='Das Passwort stimmt nicht. Versuch es noch einmal.';
    document.getElementById('pw').select();
  }
});
gemerkt();
</script>
